name: gridmote
description: "Dynamic IoT control app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: 13.1.0
  path_provider: ^2.1.6
  flutter_bluetooth_serial_plus: 0.5.6
  permission_handler: 12.0.3

  cryptography: 2.9.0
  flutter_secure_storage: 11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/gridmote_icon.png"